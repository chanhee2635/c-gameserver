<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="70" y="26" font-size="17" font-weight="700" fill="#212529">GameServer 부하 테스트 — 동시접속 대비 CPU·틱 지연 (현재 빌드)</text>
  <text x="70" y="412" font-size="12" fill="#495057">전 구간 패킷 유실 0 · 수신 백로그 0 · DB 실패 0  |  단일 PC(i5-1240P 16T) co-located, sceneCount=8 · 3,000 CCU 무손실 · 2026-06-07</text>

  <!-- grid -->
  <g stroke="#e9ecef" stroke-width="1">
    <line x1="70" y1="40"  x2="700" y2="40"/>
    <line x1="70" y1="115" x2="700" y2="115"/>
    <line x1="70" y1="190" x2="700" y2="190"/>
    <line x1="70" y1="265" x2="700" y2="265"/>
    <line x1="70" y1="340" x2="700" y2="340"/>
  </g>

  <!-- left axis (CPU %, 0-24) -->
  <g font-size="11" fill="#d9480f" text-anchor="end">
    <text x="62" y="344">0</text><text x="62" y="269">6</text><text x="62" y="194">12</text><text x="62" y="119">18</text><text x="62" y="44">24</text>
  </g>
  <text x="20" y="195" font-size="12" fill="#d9480f" transform="rotate(-90 20 195)" text-anchor="middle" font-weight="700">CPU %  (서버 프로세스)</text>

  <!-- right axis (tick lag ms, 0-48) -->
  <g font-size="11" fill="#1971c2" text-anchor="start">
    <text x="708" y="344">0</text><text x="708" y="269">12</text><text x="708" y="194">24</text><text x="708" y="119">36</text><text x="708" y="44">48</text>
  </g>
  <text x="745" y="195" font-size="12" fill="#1971c2" transform="rotate(90 745 195)" text-anchor="middle" font-weight="700">평균 틱 지연 (ms)</text>

  <!-- axes -->
  <line x1="70" y1="40" x2="70" y2="340" stroke="#adb5bd"/>
  <line x1="700" y1="40" x2="700" y2="340" stroke="#adb5bd"/>
  <line x1="70" y1="340" x2="700" y2="340" stroke="#adb5bd"/>

  <!-- x labels (CCU): 500..3000, x=70,196,322,448,574,700 -->
  <g font-size="11" fill="#495057" text-anchor="middle">
    <text x="70" y="358">500</text><text x="196" y="358">1000</text><text x="322" y="358">1500</text>
    <text x="448" y="358">2000</text><text x="574" y="358">2500</text><text x="700" y="358">3000</text>
  </g>
  <text x="385" y="378" font-size="12" fill="#212529" text-anchor="middle" font-weight="700">동시 접속 (CCU)  ·  3,000 무손실 수용</text>

  <!-- CPU line (left axis) -->
  <polyline fill="none" stroke="#d9480f" stroke-width="2.5"
    points="70,331.25 196,310 322,278.75 448,203.75 574,140 700,65"/>
  <g fill="#d9480f">
    <circle cx="70" cy="331.25" r="3.5"/><circle cx="196" cy="310" r="3.5"/><circle cx="322" cy="278.75" r="3.5"/>
    <circle cx="448" cy="203.75" r="3.5"/><circle cx="574" cy="140" r="3.5"/><circle cx="700" cy="65" r="3.5"/>
  </g>
  <g font-size="10.5" fill="#d9480f" text-anchor="middle">
    <text x="70" y="324">0.7</text><text x="196" y="303">2.4</text><text x="322" y="272">4.9</text>
    <text x="448" y="196">10.9</text><text x="574" y="133">16.0</text><text x="690" y="58">22</text>
  </g>

  <!-- AvgLag line (right axis) — flat 12ms -->
  <polyline fill="none" stroke="#1971c2" stroke-width="2.5"
    points="70,265 196,265 322,265 448,265 574,265 700,265"/>
  <g fill="#1971c2">
    <circle cx="70" cy="265" r="3.5"/><circle cx="196" cy="265" r="3.5"/><circle cx="322" cy="265" r="3.5"/>
    <circle cx="448" cy="265" r="3.5"/><circle cx="574" cy="265" r="3.5"/><circle cx="700" cy="265" r="3.5"/>
  </g>
  <text x="300" y="280" font-size="10.5" fill="#1971c2" text-anchor="middle">AvgLag 전 구간 12ms (평탄)</text>

  <!-- legend -->
  <g font-size="12">
    <line x1="300" y1="58" x2="332" y2="58" stroke="#d9480f" stroke-width="2.5"/>
    <circle cx="316" cy="58" r="3.5" fill="#d9480f"/>
    <text x="338" y="62" fill="#d9480f">CPU % (좌)</text>
    <line x1="440" y1="58" x2="472" y2="58" stroke="#1971c2" stroke-width="2.5"/>
    <circle cx="456" cy="58" r="3.5" fill="#1971c2"/>
    <text x="478" y="62" fill="#1971c2">평균 틱 지연 ms (우)</text>
  </g>
</svg>
