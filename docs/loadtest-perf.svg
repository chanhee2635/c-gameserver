<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430" font-family="Segoe UI, Arial, sans-serif">
  <rect x="0" y="0" width="760" height="430" fill="#ffffff"/>
  <text x="70" y="26" font-size="17" font-weight="700" fill="#212529">GameServer 부하 테스트 — 동시접속 대비 CPU·틱 지연</text>
  <text x="70" y="412" font-size="12" fill="#495057">전 구간 패킷 유실 0 · 수신 백로그 0 · DB 실패 0  |  단일 PC(i5-1240P 16T), Login·Gate·Game·부하기 co-located, sceneCount=8</text>

  <!-- grid + left axis (CPU %) -->
  <g stroke="#e9ecef" stroke-width="1">
    <line x1="70" y1="40"  x2="700" y2="40"/>
    <line x1="70" y1="115" x2="700" y2="115"/>
    <line x1="70" y1="190" x2="700" y2="190"/>
    <line x1="70" y1="265" x2="700" y2="265"/>
    <line x1="70" y1="340" x2="700" y2="340"/>
  </g>
  <g font-size="11" fill="#d9480f" text-anchor="end">
    <text x="62" y="344">0</text><text x="62" y="269">15</text><text x="62" y="194">30</text><text x="62" y="119">45</text><text x="62" y="44">60</text>
  </g>
  <text x="20" y="195" font-size="12" fill="#d9480f" transform="rotate(-90 20 195)" text-anchor="middle" font-weight="700">CPU %  (서버 프로세스)</text>

  <!-- right axis (AvgLag ms) -->
  <g font-size="11" fill="#1971c2" text-anchor="start">
    <text x="708" y="344">0</text><text x="708" y="269">10</text><text x="708" y="194">20</text><text x="708" y="119">30</text><text x="708" y="44">40</text>
  </g>
  <text x="745" y="195" font-size="12" fill="#1971c2" transform="rotate(90 745 195)" text-anchor="middle" font-weight="700">평균 틱 지연 (ms)</text>

  <!-- axes -->
  <line x1="70" y1="40" x2="70" y2="340" stroke="#adb5bd"/>
  <line x1="700" y1="40" x2="700" y2="340" stroke="#adb5bd"/>
  <line x1="70" y1="340" x2="700" y2="340" stroke="#adb5bd"/>

  <!-- x labels (CCU) -->
  <g font-size="11" fill="#495057" text-anchor="middle">
    <text x="70" y="358">500</text><text x="196" y="358">1000</text><text x="322" y="358">1500</text>
    <text x="448" y="358">2000</text><text x="574" y="358">2500</text><text x="700" y="358">3000</text>
  </g>
  <text x="385" y="378" font-size="12" fill="#212529" text-anchor="middle" font-weight="700">동시 접속 (CCU)</text>

  <!-- quality-knee marker at 2500 -->
  <line x1="574" y1="40" x2="574" y2="340" stroke="#f08c00" stroke-width="1" stroke-dasharray="4 3"/>
  <text x="570" y="54" font-size="10.5" fill="#f08c00" text-anchor="end">품질 무릎 ~2,500</text>

  <!-- CPU line (left axis) -->
  <polyline fill="none" stroke="#d9480f" stroke-width="2.5"
    points="70,324 196,281 322,241 448,189.5 574,158.5 700,75"/>
  <g fill="#d9480f">
    <circle cx="70" cy="324" r="3.5"/><circle cx="196" cy="281" r="3.5"/><circle cx="322" cy="241" r="3.5"/>
    <circle cx="448" cy="189.5" r="3.5"/><circle cx="574" cy="158.5" r="3.5"/><circle cx="700" cy="75" r="3.5"/>
  </g>
  <g font-size="10.5" fill="#d9480f" text-anchor="middle">
    <text x="70" y="316">3.2</text><text x="196" y="273">11.8</text><text x="322" y="233">19.8</text>
    <text x="448" y="181">30.1</text><text x="574" y="150">36.3</text><text x="690" y="68">53.0</text>
  </g>

  <!-- AvgLag line (right axis) -->
  <polyline fill="none" stroke="#1971c2" stroke-width="2.5"
    points="70,249.25 196,250 322,249.25 448,231.25 574,194.5 700,209.5"/>
  <g fill="#1971c2">
    <circle cx="70" cy="249.25" r="3.5"/><circle cx="196" cy="250" r="3.5"/><circle cx="322" cy="249.25" r="3.5"/>
    <circle cx="448" cy="231.25" r="3.5"/><circle cx="574" cy="194.5" r="3.5"/><circle cx="700" cy="209.5" r="3.5"/>
  </g>
  <g font-size="10.5" fill="#1971c2" text-anchor="middle">
    <text x="110" y="247">12.1</text><text x="448" y="225">14.5</text><text x="574" y="188">19.4</text><text x="700" y="224">17.4</text>
  </g>

  <!-- legend -->
  <g font-size="12">
    <line x1="360" y1="58" x2="392" y2="58" stroke="#d9480f" stroke-width="2.5"/>
    <circle cx="376" cy="58" r="3.5" fill="#d9480f"/>
    <text x="398" y="62" fill="#d9480f">CPU % (좌)</text>
    <line x1="480" y1="58" x2="512" y2="58" stroke="#1971c2" stroke-width="2.5"/>
    <circle cx="496" cy="58" r="3.5" fill="#1971c2"/>
    <text x="518" y="62" fill="#1971c2">평균 틱 지연 ms (우)</text>
  </g>
</svg>
